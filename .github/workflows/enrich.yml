name: TMDB enrichment

# Fetches metadata for films that do not have any yet. Safe to run on a schedule:
# the script skips everything already enriched, so a typical run prints
# "Nothing to do." and exits in a couple of seconds.
#
# New films only appear when a fresh Letterboxd export is imported, so weekly is
# plenty. Use "Run workflow" on the Actions tab for an immediate run after importing.
#
# Requires three repository secrets (Settings > Secrets and variables > Actions):
#   TMDB_TOKEN            TMDB API Read Access Token
#   SUPABASE_URL          project URL   (already used by the keepalive workflow)
#   SUPABASE_SERVICE_KEY  service_role key — needed to write film_metadata

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, 04:00 UTC
  workflow_dispatch:
    inputs:
      force_one:
        description: 'Re-fetch one film, to prove TMDB_TOKEN works'
        type: boolean
        default: false

permissions:
  contents: read

# Never let a manual run collide with the scheduled one.
concurrency:
  group: tmdb-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Enrich
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # There is no .env on a runner; the script reads these from the environment.
        # It exits non-zero if any film failed, so a red run means something to look at
        # rather than a silent partial success.
        # A normal run exits early when nothing needs metadata, which means it never
        # calls TMDB — so a green run proves the Supabase secrets and nothing else.
        # force_one re-fetches a single film so the token is actually exercised. It
        # rewrites metadata that already exists, so it cannot lose anything.
        run: |
          if [ "${{ inputs.force_one }}" = "true" ]; then
            npm run enrich -- --force --limit 1
          else
            npm run enrich
          fi

      # Enrichment can only vouch for what it fetched THIS run, and a typical run fetches
      # nothing. This re-checks every stored id against TMDB, and against Letterboxd's own id
      # where the RSS feed reaches. Without it a wrong match waits for somebody to think of
      # looking, which is not a plan — "Beyond" sat wrong for months precisely that way.
      #
      # if: always() so a failed fetch above cannot hide an audit finding: the two report
      # different problems and the job conclusion should reflect both.
      #
      # Red only on a contradiction, where Letterboxd's id disagrees with the stored one and
      # there is nothing to judge. Inexact titles are warnings — plenty are legitimate
      # (Three Colours/Colors), and a check that cries wolf gets muted.
      - name: Audit stored TMDB matches
        if: always()
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run enrich -- --audit
